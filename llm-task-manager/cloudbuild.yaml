steps:
  # =====================================================
  # 1. Build API image (FastAPI REST)
  # =====================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '--target'
      - 'api'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/api:${_TAG}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/api:latest'
      - '.'

  # =====================================================
  # 2. Build MCP image (standalone MCP server)
  # =====================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-mcp'
    args:
      - 'build'
      - '--target'
      - 'mcp'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/mcp:${_TAG}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/mcp:latest'
      - '.'
    waitFor: ['-']  # Run in parallel with API build

  # =====================================================
  # 3. Push images to Artifact Registry
  # =====================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/api'
    waitFor: ['build-api']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-mcp'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/mcp'
    waitFor: ['build-mcp']

  # =====================================================
  # 5. Deploy API on Cloud Run
  # =====================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'llm-task-manager-api'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/api:${_TAG}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'ENVIRONMENT=production'
      - '--set-secrets'
      - 'DATABASE_URL=llm-task-manager-db-url:latest,JWT_SECRET_KEY=jwt-secret:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west1:llm-task-manager-db'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
    waitFor: ['push-api']

  # =====================================================
  # 6. Deploy MCP on Cloud Run (separate service)
  # =====================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-mcp'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'llm-task-manager-mcp'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/mcp:${_TAG}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8001'
      - '--set-env-vars'
      - 'ENVIRONMENT=production'
      - '--set-secrets'
      - 'DATABASE_URL=llm-task-manager-db-url:latest,JWT_SECRET_KEY=jwt-secret:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west1:llm-task-manager-db'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--session-affinity'
    waitFor: ['push-mcp']

substitutions:
  _TAG: 'latest'  # Override with: --substitutions=_TAG=v1.2.3

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/api:${_TAG}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/api:latest'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/mcp:${_TAG}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/llm-task-manager/mcp:latest'
